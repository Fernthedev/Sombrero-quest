name: NDK build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
        name: Checkout
        with:
          submodules: true
          lfs: true

      - name: Setup QPM
        uses: Fernthedev/qpm-action@v1
        with:
          resolve_ndk: true
          #required
          workflow_token: ${{secrets.GITHUB_TOKEN}}

          restore: true # will run restore on download
          cache: true #will cache dependencies

      - name: QPM Collapse
        run: |
          qpm collapse

      - name: Build
        run: |
          cd ${GITHUB_WORKSPACE}
          qpm s build
